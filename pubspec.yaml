name: mindy_flutter
description: Mindy Center - bản Flutter clone từ MindyMobile (React Native).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + DI (thay TanStack Query + Zustand)
  flutter_riverpod: ^3.0.3
  # Điều hướng (thay React Navigation)
  go_router: ^16.2.0
  # HTTP + cookie HttpOnly (thay Axios)
  dio: ^5.9.0
  dio_cookie_manager: ^3.2.0
  cookie_jar: ^4.0.8
  flutter_secure_storage: ^9.2.4
  # Lưu ngôn ngữ (thay MMKV)
  shared_preferences: ^2.5.3
  # Kiểm tra mạng (thay NetInfo)
  connectivity_plus: ^6.1.4
  # Ngày/tiền/múi giờ
  intl: ^0.20.2
  timezone: ^0.10.1
  # UI
  flutter_svg: ^2.2.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  # Idempotency-Key cho điểm danh (UUID v4)
  uuid: ^4.5.1
  # MF5: chọn file native và render bài viết canonical
  file_picker: ^11.0.3
  flutter_widget_from_html_core: ^0.17.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # flutter_secure_storage 9.x requires CocoaPods on iOS.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/images/
    - assets/illustrations/
    - assets/fonts/RobotoMono-OFL.txt
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    # Font + icon của giao diện staff (Login chung, Mentor) - lấy từ file Claude Design
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    - family: MaterialSymbolsRounded
      fonts:
        - asset: assets/fonts/MaterialSymbolsRounded.ttf
